name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]
    tags: ["v*"]

jobs:
  ci:
    uses: NUS-MTech-Capstone/github-actions-shared/.github/workflows/go-ci.yaml@main
    with:
      go-version: "1.26.4"

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dendenmushi
          POSTGRES_USER: dendenmushi
          POSTGRES_PASSWORD: dendenmushi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dendenmushi -d dendenmushi"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          cache: true
      - name: Run PostgreSQL tests
        env:
          TEST_DATABASE_URL: postgres://dendenmushi:dendenmushi@localhost:5432/dendenmushi?sslmode=disable
        run: go test ./...
