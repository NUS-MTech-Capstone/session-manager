services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dendenmushi
      POSTGRES_USER: dendenmushi
      POSTGRES_PASSWORD: dendenmushi
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dendenmushi -d dendenmushi"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - session-manager-postgres:/var/lib/postgresql/data

volumes:
  session-manager-postgres:
